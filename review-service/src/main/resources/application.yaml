server:
  port: 8086

spring:
  application:
    name: review-service

  datasource:
    url: jdbc:postgresql://localhost:5433/salon_db
    password: postgres
    username: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
