version: '3.8'

services:
  # ==================== БАЗЫ ДАННЫХ ====================

  postgres-main:
    image: postgres:16-alpine
    container_name: salon-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salon_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - salon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: salon-redis
    ports:
      - "6379:6379"
    networks:
      - salon-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== МИКРОСЕРВИСЫ ====================

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway-service
      dockerfile: Dockerfile
    container_name: salon-api-gateway
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Без Eureka пока
    depends_on:
      - catalog-service
      - auth-service
      - booking-service
    networks:
      - salon-network
    restart: unless-stopped

  # Сервис каталога
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: salon-catalog
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-main:5432/salon_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      postgres-main:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - salon-network
    restart: unless-stopped

  # Сервис аутентификации
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: salon-auth
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-main:5432/salon_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: 9a4f94d8170b1343feaa84181286e1112233445566778899aabbccddeeff0011
    depends_on:
      postgres-main:
        condition: service_healthy
    networks:
      - salon-network
    restart: unless-stopped

  # Сервис бронирований
  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: salon-booking
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-main:5432/salon_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      postgres-main:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - salon-network
    restart: unless-stopped

  # Сервис истории
  history-service:
    build:
      context: ./history-service
      dockerfile: Dockerfile
    container_name: salon-history
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-main:5432/salon_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres-main:
        condition: service_healthy
    networks:
      - salon-network
    restart: unless-stopped

  # Сервис уведомлений
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: salon-notification
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      FIREBASE_CREDENTIALS: /app/firebase-service-account.json  # ✅ путь к Firebase ключу
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-main:
        condition: service_healthy
    networks:
      - salon-network
    restart: unless-stopped

  # Сервис отзывов
  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: salon-review
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-main:5432/salon_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      postgres-main:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - salon-network
    restart: unless-stopped

# ==================== СЕТИ И ТОМА ====================

networks:
  salon-network:
    driver: bridge

volumes:
  postgres_data:
