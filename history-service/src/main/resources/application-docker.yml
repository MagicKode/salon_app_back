server:
  port: 8084
  address: 0.0.0.0

spring:
  application:
    name: history-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-main:5432/salon_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:9a4f94d8170b1343feaa84181286e1112233445566778899aabbccddeeff0011}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.service.salon: DEBUG