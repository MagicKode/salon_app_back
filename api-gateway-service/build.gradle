plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

ext {
    set('springCloudVersion', "2024.0.0") // Идеальный релизный поезд для Spring Boot 3.4.x
}

dependencyManagement {
    imports {
        // Подключаем BOM, чтобы Грэдл узнал точные версии для cloud-стартеров
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Библиотеки для работы с JWT токенами на Шлюзе
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
}

configurations.configureEach {
    // Удаляем классический веб (Tomcat)
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
    // Удаляем WebMVC Swagger, так как для WebFlux нужен другой стартер (springdoc-openapi-starter-webflux-ui)
    exclude group: 'org.springdoc', module: 'springdoc-openapi-starter-webmvc-ui'
    // Удаляем JPA и Postgres, шлюзу не нужна БД
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-data-jpa'
    exclude group: 'org.postgresql', module: 'postgresql'
}

bootJar {
    enabled = true
}
jar {
    enabled = false
}
