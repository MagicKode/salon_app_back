server:
  port: 8087
  address: 0.0.0.0

spring:
  application:
    name: api-gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://auth-service:8082
          predicates:
            - Path=/api/v1/auth/**

        - id: catalog-service-route
          uri: http://catalog-service:8081
          predicates:
            - Path=/api/v1/catalog/**
          filters:
            - AuthenticationFilter

        - id: booking-service-route
          uri: http://booking-service:8083
          predicates:
            - Path=/api/v1/bookings/**
            - Path=/api/v1/master/schedule/**
          filters:
            - AuthenticationFilter

        - id: notification-service-route
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - AuthenticationFilter

        - id: history-service-route
          uri: http://history-service:8084
          predicates:
            - Path=/api/v1/history/**
          filters:
            - AuthenticationFilter

        - id: review-service-route
          uri: http://review-service:8086
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - AuthenticationFilter

jwt:
  secret: ${JWT_SECRET:9a4f94d8170b1343feaa84181286e1112233445566778899aabbccddeeff0011}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.service.salon: DEBUG
