server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  cloud:
    gateway:
      routes:
        # Маршрут для сервиса каталога
        - id: catalog-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/catalog/**
          filters:
            - AuthenticationFilter

        # Маршрут для сервиса авторизации (задел на будущее)
        - id: auth-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auth/**

        # Маршрут для сервиса бронирования
        - id: booking-service
          uri: http://localhost:8083 # Или http://localhost:8083 (зависит от того, используешь ли ты Eureka)
          predicates:
              - Path=/api/v1/bookings/**, /api/v1/master/schedule/**,
          filters: # FIX: Обязательно добавляем фильтр, чтобы парсился JWT и прокидывался X-User-Name!
            - AuthenticationFilter

jwt:
