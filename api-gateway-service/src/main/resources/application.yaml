server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  cloud:
    gateway:
      routes:
        # Маршрут для сервиса каталога
        - id: catalog-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/catalog/**
          filters:
            - AddRequestHeader=X-Gateway-Request, True # Чистый код: помечаем, что запрос прошел через шлюз

        # Маршрут для сервиса авторизации (задел на будущее)
        - id: auth-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auth/**

