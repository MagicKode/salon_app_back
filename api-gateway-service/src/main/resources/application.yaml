server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  cloud:
    gateway:
      routes:
        # Маршрут для сервиса каталога
        - id: catalog-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/catalog/**
          filters:
            - AuthenticationFilter

        # Маршрут для сервиса авторизации (задел на будущее)
        - id: auth-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auth/**

jwt:
  secret: 9a4f94d8170b1343feaa84181286e1112233445566778899aabbccddeeff0011 # Точно такой же, как в auth-service!
