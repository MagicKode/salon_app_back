plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':base-domains') // Подключение доменного модуля
    implementation project(':common-service') // Подключение общих утилит

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
}

bootJar {
    enabled = true
}
jar {
    enabled = false
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}