server:
  port: 8081 # Порт этого микросервиса (auth-service будет на 8080, booking на 8082)

spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:postgresql://localhost:5433/salon_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

