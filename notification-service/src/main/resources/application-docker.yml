server:
  port: 8085
  address: 0.0.0.0

spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-main:5432/salon_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Firebase конфигурация
firebase:
  service-account:
    file: ${FIREBASE_CREDENTIALS:/app/firebase-service-account.json}

jwt:
  secret: ${JWT_SECRET:9a4f94d8170b1343feaa84181286e1112233445566778899aabbccddeeff0011}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.service.salon: DEBUG
    com.service.salon.notification: DEBUG