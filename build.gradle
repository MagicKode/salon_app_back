plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2' apply(false)
    id 'io.spring.dependency-management' version '1.1.7' apply(false)
}

//dependencies {
//    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
//    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
//    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
//}

allprojects {
    group = 'com.service.salon'
    version = '0.0.1-SNAPSHOT'
    description = 'salon-app-back'

    repositories {
        mavenCentral()
        maven { url = 'https://repo.spring.io/snapshot' }
        maven { url = "https://packages.confluent.io/maven/" }
        maven { url 'https://repo.spring.io/milestone' }
        mavenLocal()
    }
}

subprojects {

    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom "com.fasterxml.jackson:jackson-bom:2.18.2"
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

//    configurations.all {
//        resolutionStrategy {
//            // Принудительно задаем версию для всех транзитивных зависимостей
//            force 'io.jsonwebtoken:jjwt-api:0.11.5'
//            force 'io.jsonwebtoken:jjwt-impl:0.11.5'
//            force 'io.jsonwebtoken:jjwt-jackson:0.11.5'
//        }
//    }

    dependencies {

        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'

        implementation 'org.springframework.boot:spring-boot-starter-cache'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

        implementation 'org.postgresql:postgresql:42.7.10'

        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        implementation 'org.mapstruct:mapstruct:1.6.3'
        annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
        annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

configure(subprojects.findAll { it.name != 'api-gateway-service' }) {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    }
}
